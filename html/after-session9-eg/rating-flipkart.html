<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h1>Product Review</h1>
        <label for="name">Name : </label>
        <input type="text" placeholder="Enter your name">
        <br><br>
        <label for="pname">Product Name : </label>
        <input type="text" placeholder="Enter product name">
        <br><br>
        <label for="rating">Rating : </label>
        <input type="radio" id="one" name="rating" value="1">
        <label for="one">1 Star</label>

        <input type="radio" id="two" name="rating" value="2">
        <label for="two">2 Stars</label>

        <input type="radio" id="three" name="rating" value="3">
        <label for="three">3 Stars</label>

        <input type="radio" id="four" name="rating" value="4">
        <label for="four">4 Stars</label>

        <input type="radio" id="five" name="rating" value="5">
        <label for="five">5 Stars</label>
        <br><br>
        <label for="review">Review : </label>
        <textarea name="review"></textarea>
        <br><br>
        <button>Submit </button>
        
       
    </form>
</body>
</html>
