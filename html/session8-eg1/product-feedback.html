<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Product Feedback</h1>

    <form>

        <label for="product">Product Name:</label>
        <input type="text" id="product" name="product">

        <br><br>

        <label>Rating : </label>

        <input type="radio" id="star1" name="rating" value="1">
        <label for="star1">1 star</label>

        <input type="radio" id="star2" name="rating" value="2">
        <label for="star2">2 star</label>

        <input type="radio" id="star3" name="rating" value="3">
        <label for="star3">3 star</label>

        <input type="radio" id="star4" name="rating" value="4">
        <label for="star4">4 star</label>

        <input type="radio" id="star5" name="rating" value="5">
        <label for="star5">5 star</label>

        <br><br>

        <label for="review">Review:</label>
        <br>
        <textarea id="review" name="review" rows="5" cols="40"></textarea>

        <br><br>

        <label for="photo">Upload product photo :</label>
        <input type="file" id="photo" name="photo">

        <br><br>

        <button>Submit Feedback</button>

    </form>

</body>
</html>
