<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h1>Movie Booking Feedback</h1>

    <form method="post" >

        <h2>Rate your experience:</h2>

        <input type="radio" value="1">
        <label for="one">1 Star</label>

        <input type="radio" value="2">
        <label for="two">2 Stars</label>

        <input type="radio"  value="3">
        <label for="three">3 Stars</label>

        <input type="radio" value="4">
        <label for="four">4 Stars</label>

        <input type="radio" value="5">
        <label for="five">5 Stars</label>

        <h3>Features Used:</h3>

        <input type="checkbox" value="seat-selection">
        <label for="seat">Seat Selection</label>

        <br>

        <input type="checkbox" value="food-order">
        <label for="food">Food Order</label>

        <br>

        <input type="checkbox" value="payment">
        <label for="payment">Payment</label>

        <br><br>

        <input type="submit" value="Submit">

    </form>
</body>
</html>
