<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Email Validation</h1>

    <form method="post" >

        <label for="email">Email:</label>
        <input type="email"
               pattern="[a-zA-Z0-9._%+-]+@gmail\.com"
               required>

        <br><br>

        <input type="submit" value="Submit">

    </form>
</body>
</html>
