<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Flipkart Order Page</h1>
     <table border="2">
        <tr>
            <th colspan="4">Order Summary</th>
        </tr>

        <tr>
            <th>Product Name</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Total</th>
        </tr>

        <tr>
            <td>T.V.</td>
            <td>1</td>
            <td>₹15,000</td>
            <td>₹15,000</td>
        </tr>

        <tr>
            <td>Wireless Headphone</td>
            <td>2</td>
            <td>₹2,000</td>
            <td>₹4,000</td>
        </tr>
        
        <tr>
            <td rowspan="2"><b>Sub Total</b></td>
            <td colspan="2"><b>Delivery Charges</b></td>
            <td><b>₹0</b></td>
        </tr>

        <tr>
            <td colspan="2"><b>Order total</b></td>
            <td><b>₹19,000</b></td>
        </tr>

    </table>
</body>
</html>
