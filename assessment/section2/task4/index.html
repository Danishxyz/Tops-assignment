
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Restaurant Listing</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Popular Restaurants</h1>
        <p>Discover delicious food near you!</p>
    </header>

    <main class="restaurant-container">

        <div class="restaurant-card">
            <h2>Pizza House</h2>
            <p>Enjoy delicious, cheesy Italian pizza.</p>
            <button type="button">Order Now</button>
        </div>

        <div class="restaurant-card">
            <h2>Burger Corner</h2>
            <p>Fresh burgers with crispy golden fries.</p>
            <button type="button">Order Now</button>
        </div>

        <div class="restaurant-card">
            <h2>Tomato House</h2>
            <p>Authentic Indian dishes full of flavour.</p>
            <button type="button">Order Now</button>
        </div>

        <div class="restaurant-card">
            <h2>Sweet Shop</h2>
            <p>Delicious cakes, pastries and desserts.</p>
            <button type="button">Order Now</button>
        </div>

    </main>

</body>
</html>
